<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noticias y avisos</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">

  <style>
    .contenedor { max-width: 46rem; }
    .aviso-titulo { font-weight: 600; }
    .aviso-fecha { font-size: .8125rem; white-space: nowrap; opacity: .8; }
    .aviso-texto { max-width: 68ch; }
  </style>
</head>

<body>
  <main class="contenedor container py-4 py-md-5">
    <header class="d-flex flex-wrap justify-content-between align-items-baseline gap-2 mb-4">
      <h1 class="h3 mb-0">Noticias y avisos</h1>
      <p id="estado" class="small text-body-secondary mb-0" role="status"></p>
    </header>

    <section id="avisos" aria-label="Lista de noticias"></section>

    <p class="mt-3 mb-0">
      <button id="btnRestaurar" type="button" class="btn btn-link btn-sm p-0" hidden>
        Mostrar noticias descartadas
      </button>
    </p>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script>
  (() => {
    "use strict";

    // ===== Configuración =====
    const ARCHIVO = "noticias.json";            // debe estar junto a este index.html
    const ACTUALIZAR_CADA_MIN = 5;              // cada cuántos minutos se vuelve a leer el JSON
    const OCULTAR_AVISOS_DE_VERSION = true;     // los avisos con "versionMenorA" son para la app de escritorio
    const CLAVE_DESCARTADAS = "noticias_descartadas_v1";

    const TIPOS = {
      info:    { clase: "alert-info",      nombre: "Información" },
      alerta:  { clase: "alert-warning",   nombre: "Alerta" },
      novedad: { clase: "alert-primary",   nombre: "Novedad" },
      otro:    { clase: "alert-secondary", nombre: "Aviso" }
    };

    // <test-start>
    function leerFecha(texto) {
      if (!texto) return null;
      const d = new Date(texto);               // "2026-10-19T08:00:00" se interpreta en hora local
      return isNaN(d.getTime()) ? null : d;
    }

    // Mismas reglas que la app de escritorio: activa, fecha de publicación, expira y días de vigencia
    function esVigente(n, ahora) {
      if (!n || n.activa === false) return false;
      if (OCULTAR_AVISOS_DE_VERSION && n.versionMenorA) return false;

      const inicio = leerFecha(n.fecha);
      if (inicio && inicio > ahora) return false;               // programada: aún no llega

      let fin = leerFecha(n.expira);
      const dias = Number(n.diasVisible) || 0;
      if (inicio && dias > 0) {
        // N días de calendario: el día de publicación cuenta como el día 1
        const finDias = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + dias);
        if (!fin || finDias < fin) fin = finDias;
      }
      return !fin || fin > ahora;
    }
    // <test-end>

    // ===== Estado =====
    const $avisos = document.getElementById("avisos");
    const $estado = document.getElementById("estado");
    const $restaurar = document.getElementById("btnRestaurar");

    let todas = [];
    let hayError = false;
    let ultimaCarga = null;
    let firmaActual = "";

    // ===== Noticias descartadas (se recuerdan en este navegador) =====
    function leerDescartadas() {
      try {
        const v = JSON.parse(localStorage.getItem(CLAVE_DESCARTADAS) || "[]");
        return new Set(Array.isArray(v) ? v : []);
      } catch { return new Set(); }
    }
    function guardarDescartadas(set) {
      try { localStorage.setItem(CLAVE_DESCARTADAS, JSON.stringify([...set])); } catch { /* sin almacenamiento */ }
    }

    // ===== Construcción de una alerta (todo con textContent: sin HTML inyectado) =====
    function urlSegura(texto) {
      if (!texto) return null;
      try {
        const u = new URL(texto, location.href);
        return (u.protocol === "https:" || u.protocol === "http:") ? u.href : null;
      } catch { return null; }
    }

    function crearAlerta(n) {
      const tipo = TIPOS[String(n.tipo || "").toLowerCase()] || TIPOS.otro;

      const alerta = document.createElement("article");
      alerta.className = `alert ${tipo.clase} alert-dismissible fade show`;

      const cabecera = document.createElement("div");
      cabecera.className = "d-flex flex-wrap justify-content-between align-items-baseline column-gap-3";

      const titulo = document.createElement("h2");
      titulo.className = "aviso-titulo h6 mb-1";
      const oculto = document.createElement("span");
      oculto.className = "visually-hidden";
      oculto.textContent = `${tipo.nombre}: `;
      titulo.append(oculto, n.titulo || "Aviso");
      cabecera.append(titulo);

      const fecha = leerFecha(n.fecha);
      if (fecha) {
        const t = document.createElement("time");
        t.className = "aviso-fecha";
        t.dateTime = fecha.toISOString();
        t.textContent = fecha.toLocaleDateString("es-EC", { day: "numeric", month: "short", year: "numeric" });
        cabecera.append(t);
      }
      alerta.append(cabecera);

      if (n.mensaje) {
        const p = document.createElement("p");
        p.className = "aviso-texto mb-0";
        p.textContent = n.mensaje;
        alerta.append(p);
      }

      const enlace = urlSegura(n.url);
      if (enlace) {
        const p = document.createElement("p");
        p.className = "mb-0 mt-2";
        const a = document.createElement("a");
        a.className = "alert-link";
        a.href = enlace;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "Ver más";
        p.append(a);
        alerta.append(p);
      }

      const cerrar = document.createElement("button");
      cerrar.type = "button";
      cerrar.className = "btn-close";
      cerrar.setAttribute("data-bs-dismiss", "alert");
      cerrar.setAttribute("aria-label", "Descartar aviso");
      cerrar.addEventListener("click", () => {
        const set = leerDescartadas();
        set.add(n.id);
        guardarDescartadas(set);
        setTimeout(() => render(true), 300);     // deja terminar la animación de cierre
      });
      alerta.append(cerrar);

      return alerta;
    }

    // ===== Pintado =====
    function render(forzar) {
      const ahora = new Date();
      const descartadas = leerDescartadas();

      const vigentes = todas
        .filter(n => esVigente(n, ahora))
        .sort((a, b) => (leerFecha(b.fecha)?.getTime() || 0) - (leerFecha(a.fecha)?.getTime() || 0));
      const visibles = vigentes.filter(n => !descartadas.has(n.id));
      const nDescartadas = vigentes.length - visibles.length;

      // Línea de estado
      if (ultimaCarga) {
        const hora = ultimaCarga.toLocaleTimeString("es-EC", { hour: "2-digit", minute: "2-digit" });
        $estado.textContent = hayError
          ? `Sin conexión. Se muestra la lista de las ${hora}.`
          : `Actualizado a las ${hora}.`;
      } else {
        $estado.textContent = hayError ? "" : "Cargando…";
      }
      $restaurar.hidden = nDescartadas === 0;

      // Solo se vuelve a pintar si cambió algo (evita perder el foco del teclado)
      const sinDatos = hayError && !ultimaCarga;
      const firma = JSON.stringify([visibles.map(n => [n.id, n.titulo, n.mensaje, n.tipo, n.url, n.fecha]), sinDatos, nDescartadas]);
      if (!forzar && firma === firmaActual) return;
      firmaActual = firma;

      const nodos = [];
      if (sinDatos) {
        const div = document.createElement("div");
        div.className = "alert alert-danger d-flex flex-wrap align-items-center justify-content-between gap-2";
        const texto = document.createElement("span");
        texto.textContent = "No se pudo cargar la lista de noticias. Revisa tu conexión e inténtalo de nuevo.";
        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "btn btn-sm btn-outline-danger";
        boton.textContent = "Reintentar";
        boton.addEventListener("click", cargar);
        div.append(texto, boton);
        nodos.push(div);
      } else if (visibles.length === 0 && ultimaCarga) {
        const p = document.createElement("p");
        p.className = "text-body-secondary";
        p.textContent = nDescartadas > 0
          ? `Descartaste ${nDescartadas} ${nDescartadas === 1 ? "noticia" : "noticias"}. Puedes volver a mostrarlas abajo.`
          : "No hay noticias por ahora.";
        nodos.push(p);
      } else {
        visibles.forEach(n => nodos.push(crearAlerta(n)));
      }
      $avisos.replaceChildren(...nodos);
    }

    // ===== Carga del JSON =====
    async function cargar() {
      try {
        const r = await fetch(`${ARCHIVO}?t=${Date.now()}`, { cache: "no-store" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const datos = await r.json();
        todas = Array.isArray(datos.noticias) ? datos.noticias : [];
        ultimaCarga = new Date();
        hayError = false;
      } catch (e) {
        hayError = true;
        console.warn("No se pudo leer", ARCHIVO, e);
      }
      render(true);
    }

    $restaurar.addEventListener("click", () => {
      const ahora = new Date();
      const set = leerDescartadas();
      todas.filter(n => esVigente(n, ahora)).forEach(n => set.delete(n.id));
      guardarDescartadas(set);
      render(true);
    });

    // ===== Tema claro/oscuro según el sistema =====
    const oscuro = matchMedia("(prefers-color-scheme: dark)");
    const aplicarTema = () => document.documentElement.setAttribute("data-bs-theme", oscuro.matches ? "dark" : "light");
    aplicarTema();
    oscuro.addEventListener("change", aplicarTema);

    // ===== Arranque =====
    render(true);
    cargar();
    setInterval(cargar, ACTUALIZAR_CADA_MIN * 60 * 1000);
    setInterval(() => render(false), 60 * 1000);          // aplica fechas programadas y vencimientos
    document.addEventListener("visibilitychange", () => { if (!document.hidden) cargar(); });
  })();
  </script>
</body>
</html>
